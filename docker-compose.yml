name: mlops-hw2

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - 127.0.0.1:9096:9096
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-setup:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, 'kafka:9092', --create, --if-not-exists, --topic, transactions, --partitions, '1', --replication-factor, '1']

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD, clickhouse-client, --query, 'SELECT 1']
      interval: 5s
      timeout: 5s
      retries: 12

  clickhouse-init:
    image: clickhouse/clickhouse-server:25.8
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    volumes:
      - ./sql:/sql:ro
    entrypoint: [clickhouse-client]
    command: [--host, clickhouse, --multiquery, --queries-file, /sql/create_tables.sql]

  producer:
    build: .
    profiles: [tools]
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transactions
    volumes:
      - ./data:/app/data:ro
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully

volumes:
  kafka-data:
  clickhouse-data:
